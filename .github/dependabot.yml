# Dependabot opens a pull request when a dependency, a GitHub Action or a Docker base image has a
# new version. Each pull request runs the whole CI (ci.yml), so an update that breaks something is
# visible before it is merged. Weekly and grouped, to keep the noise low.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-backend: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /infra
    schedule: { interval: weekly }
    groups:
      python-infra: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-frontend: { update-types: [minor, patch] }
    ignore:
      # Kept in step with the Playwright container/browsers used in CI: update it deliberately
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor"]
      # Vite 5, @vitejs/plugin-react 4.x and Vitest 2.x are a matched trio (plugin-react 6.x and
      # Vitest 3.x both need Vite 8, which we are not on): a major bump on just one of them is
      # guaranteed to fail with an ERESOLVE peer-dependency conflict, so Dependabot must not
      # propose them individually. Upgrade all three together, deliberately, when it is time.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
