name: Infrastructure

# Applies the Pulumi program when infra/ changes on main. The very first `pulumi up`
# has to be done locally (it creates the IAM roles this workflow assumes): see README.
on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  pulumi-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/tfg-gha-infra
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r infra/requirements.txt

      # First show what is going to change (in the log, for review), then apply it
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: infra
          diff: true
          cloud-url: s3://tfg-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          TFG_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TFG_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}

      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: infra
          cloud-url: s3://tfg-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          TFG_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TFG_MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
