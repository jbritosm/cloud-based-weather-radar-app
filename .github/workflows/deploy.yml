name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push images to GHCR
  id-token: write   # OIDC login to AWS

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # The very same checks as on every branch (backend, frontend unit + browser tests, infra,
  # compose): main is never built or deployed unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        # GHCR image names must be lowercase
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/tfg-backend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/tfg-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/tfg-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.value }}/tfg-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/tfg-gha-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload deployment bundle to S3
        run: |
          BUCKET="tfg-data-${{ vars.AWS_ACCOUNT_ID }}-${AWS_REGION}"
          aws s3 cp docker-compose.yml        "s3://${BUCKET}/bundle/docker-compose.yml"
          aws s3 cp docker-compose.prod.yml   "s3://${BUCKET}/bundle/docker-compose.prod.yml"
          aws s3 cp deploy/Caddyfile          "s3://${BUCKET}/bundle/deploy/Caddyfile"
          aws s3 cp deploy/deploy.sh          "s3://${BUCKET}/bundle/deploy/deploy.sh"

      - name: Store the AEMET API key in SSM Parameter Store
        # The instance reads it from there (deploy.sh); it never appears in the SSM command text.
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          if [ -n "$AEMET_API_KEY" ]; then
            aws ssm put-parameter --name /tfg/aemet_api_key --type SecureString \
              --overwrite --value "$AEMET_API_KEY" --region "$AWS_REGION" > /dev/null
            echo "AEMET key stored."
          else
            echo "AEMET_API_KEY secret not set: skipping."
          fi

      - name: Run deploy.sh on the instance (SSM)
        run: |
          BUCKET="tfg-data-${{ vars.AWS_ACCOUNT_ID }}-${AWS_REGION}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=tfg" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ]; then echo "No running tfg instance. Run infra first."; exit 1; fi

          OWNER="${{ needs.build.outputs.owner }}"
          SITE="${{ vars.SITE_ADDRESS }}"
          SITE="${SITE:-:80}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "commands=[\"aws s3 cp s3://${BUCKET}/bundle/deploy/deploy.sh /opt/tfg/deploy.sh --region ${AWS_REGION}\",\"bash /opt/tfg/deploy.sh ${GITHUB_SHA} ${OWNER} '${SITE}'\"]" \
            --query Command.CommandId --output text)

          # `wait` exits non-zero if the command fails; show the output either way.
          STATUS=0
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || STATUS=$?
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}" --output json
          exit $STATUS
