server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker and the HTML must always be revalidated, or users would keep an old
  # version of the app (and of the worker itself) for as long as the browser cache lasts.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # Vite gives these files a content hash in their name: safe to cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
